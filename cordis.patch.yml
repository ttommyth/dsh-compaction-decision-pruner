# Bundle patch: declares this plugin's row, so installing the package as a
# profile bundle both composes it and gives the Plugins page a row to configure
# (`dsh.bundle.patch` in package.json points here).
#
# `baseUrl` is deliberately absent. The plugin has no host to assume, and an
# unset value leaves it armed but inert — nothing is scored — instead of failing
# the row. Set it in your DSH client's Plugins page, or export
# DECISION_BASE_URL.
#
# To compose the plugin without the bundle path, merge this `insert` row into a
# profile's cordis patch layer yourself, or pass the file with `--patch`.
- insert:
    - id: compaction-decision-pruner
      name: 'dsh-compaction-decision-pruner'
      config:
        model: clef-flash
        keepThreshold: 0.35
        minTokensToScore: 40000
        protectTail: 6
